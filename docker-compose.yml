# Docker Compose de produção do "Time" (Coolify faz PULL da imagem pronta).
#
# O build SEMPRE acontece na máquina do dev e a imagem é publicada no Docker Hub —
# o servidor nunca builda. Buildar MULTI-ARCH (servidor amd64; Macs Apple Silicon arm64):
#   docker buildx build --platform linux/amd64,linux/arm64 \
#     -t danielmonteirodc/time:<versão> -t danielmonteirodc/time:latest --push .
# Depois, atualize TIME_IMAGE_TAG (ou o default abaixo) e redeploy no Coolify.
#
# Coolify:
#   - Build Pack: "Docker Compose"
#   - Variáveis de ambiente OBRIGATÓRIAS (sem default):
#       LEAN_DB_PASSWORD      Senha do banco do app
#       MYSQL_ROOT_PASSWORD   Senha root do MySQL (openssl rand -base64 32)
#       LEAN_APP_URL          URL pública completa (ex: https://time.seudominio.com.br)
#       LEAN_SESSION_PASSWORD Chave de sessão (openssl rand -base64 32)
#
# Para desenvolvimento local (buildar do fonte), troque `image:` pelo bloco:
#     build:
#       context: .
#       dockerfile: Dockerfile
services:
  time:
    image: danielmonteirodc/time:${TIME_IMAGE_TAG:-3.9.5}
    # Sempre puxa do registry no deploy — evita usar imagem local desatualizada
    # com a mesma tag.
    pull_policy: always
    restart: unless-stopped
    environment:
      LEAN_DB_HOST: time_db
      LEAN_DB_DATABASE: ${LEAN_DB_DATABASE:-leantime}
      LEAN_DB_USER: ${LEAN_DB_USER:-leantime}
      LEAN_DB_PASSWORD: ${LEAN_DB_PASSWORD}
      LEAN_SITENAME: ${LEAN_SITENAME:-Time}
      LEAN_DEFAULT_THEME: ${LEAN_DEFAULT_THEME:-digitalcollege}
      LEAN_APP_URL: ${LEAN_APP_URL}
      LEAN_SESSION_PASSWORD: ${LEAN_SESSION_PASSWORD}
      LEAN_DEFAULT_TIMEZONE: ${LEAN_DEFAULT_TIMEZONE:-America/Fortaleza}
      TZ: ${LEAN_DEFAULT_TIMEZONE:-America/Fortaleza}
      # Chat de suporte com IA (Time Bot) — o widget só aparece com key + assistant configurados
      LEAN_OPENAI_API_KEY: ${LEAN_OPENAI_API_KEY:-}
      LEAN_SUPPORTCHAT_ASSISTANT_ID: ${LEAN_SUPPORTCHAT_ASSISTANT_ID:-}
      LEAN_SUPPORTCHAT_ENABLED: ${LEAN_SUPPORTCHAT_ENABLED:-true}
      LEAN_SUPPORTCHAT_SCREEN_CONTEXT: ${LEAN_SUPPORTCHAT_SCREEN_CONTEXT:-true}
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CAP_CHOWN
      - CAP_SETGID
      - CAP_SETUID
    ports:
      - "8080"
    volumes:
      - public_userfiles:/var/www/html/public/userfiles
      - userfiles:/var/www/html/userfiles
      - plugins:/var/www/html/app/Plugins
      - logs:/var/www/html/storage/logs
    depends_on:
      time_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  time_db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${LEAN_DB_DATABASE:-leantime}
      MYSQL_USER: ${LEAN_DB_USER:-leantime}
      MYSQL_PASSWORD: ${LEAN_DB_PASSWORD}
    command: --character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db_data:
  userfiles:
  public_userfiles:
  plugins:
  logs:
