# Docker Compose de produção do "Time" (Coolify faz PULL da imagem pronta).
#
# O build SEMPRE acontece na máquina do dev e a imagem é publicada no Docker Hub —
# o servidor nunca builda. Buildar MULTI-ARCH (servidor amd64; Macs Apple Silicon arm64):
#   docker buildx build --platform linux/amd64,linux/arm64 \
#     -t danielmonteirodc/time:<versão> -t danielmonteirodc/time:latest --push .
# Depois, atualize TIME_IMAGE_TAG (ou o default abaixo) e redeploy no Coolify.
#
# Coolify:
#   - Build Pack: "Docker Compose"
#   - Domínio: configure no serviço `time` apontando para a porta 8080
#     (ex: `https://time.digitalcollege.com.br:8080`). O Traefik do Coolify roteia
#     para a porta EXPOSTA do container; por isso NÃO publicamos porta no host
#     (`expose`, não `ports`) — publicar porta fura o proxy e expõe o app direto.
#   - Variáveis de ambiente OBRIGATÓRIAS (sem default — o deploy falha se faltarem):
#       LEAN_DB_PASSWORD      Senha do banco do app
#       MYSQL_ROOT_PASSWORD   Senha root do MySQL (openssl rand -base64 32)
#       LEAN_APP_URL          URL pública completa (ex: https://time.seudominio.com.br)
#                             Precisa bater EXATAMENTE com o domínio configurado no Coolify.
#                             Alternativa: usar a magic var do Coolify `${SERVICE_URL_TIME_8080}`.
#       LEAN_SESSION_PASSWORD Chave de sessão (openssl rand -base64 32)
#
# Para desenvolvimento local (buildar do fonte), troque `image:` pelo bloco:
#     build:
#       context: .
#       dockerfile: Dockerfile
services:
  time:
    image: danielmonteirodc/time:${TIME_IMAGE_TAG:-3.9.5}
    # Sempre puxa do registry no deploy — evita usar imagem local desatualizada
    # com a mesma tag.
    pull_policy: always
    restart: unless-stopped
    environment:
      LEAN_DB_HOST: time_db
      LEAN_DB_DATABASE: ${LEAN_DB_DATABASE:-leantime}
      LEAN_DB_USER: ${LEAN_DB_USER:-leantime}
      LEAN_DB_PASSWORD: ${LEAN_DB_PASSWORD:?defina LEAN_DB_PASSWORD no Coolify}
      LEAN_SITENAME: ${LEAN_SITENAME:-Time}
      LEAN_APP_URL: ${LEAN_APP_URL:?defina LEAN_APP_URL com a URL pública completa}
      LEAN_SESSION_PASSWORD: ${LEAN_SESSION_PASSWORD:?defina LEAN_SESSION_PASSWORD (openssl rand -base64 32)}
      LEAN_DEFAULT_TIMEZONE: ${LEAN_DEFAULT_TIMEZONE:-America/Fortaleza}
      TZ: ${LEAN_DEFAULT_TIMEZONE:-America/Fortaleza}
      # Produção: debug desligado e log em stderr para o Coolify capturar
      # (o default do app é 'single,syslog,sentry', que escreve em arquivo dentro do container).
      LEAN_DEBUG: ${LEAN_DEBUG:-0}
      LEAN_LOG_CHANNELS: ${LEAN_LOG_CHANNELS:-stderr}
      # E-mail — necessário para convite de usuário e notificações.
      # Sem LEAN_EMAIL_RETURN a aplicação não envia e-mail.
      LEAN_EMAIL_RETURN: ${LEAN_EMAIL_RETURN:-}
      LEAN_EMAIL_USE_SMTP: ${LEAN_EMAIL_USE_SMTP:-false}
      LEAN_EMAIL_SMTP_HOSTS: ${LEAN_EMAIL_SMTP_HOSTS:-}
      LEAN_EMAIL_SMTP_PORT: ${LEAN_EMAIL_SMTP_PORT:-}
      LEAN_EMAIL_SMTP_AUTH: ${LEAN_EMAIL_SMTP_AUTH:-true}
      LEAN_EMAIL_SMTP_USERNAME: ${LEAN_EMAIL_SMTP_USERNAME:-}
      LEAN_EMAIL_SMTP_PASSWORD: ${LEAN_EMAIL_SMTP_PASSWORD:-}
      LEAN_EMAIL_SMTP_SECURE: ${LEAN_EMAIL_SMTP_SECURE:-}
      # Armazenamento de arquivos em S3 (opcional). Com false, usa os volumes locais.
      LEAN_USE_S3: ${LEAN_USE_S3:-false}
      LEAN_S3_KEY: ${LEAN_S3_KEY:-}
      LEAN_S3_SECRET: ${LEAN_S3_SECRET:-}
      LEAN_S3_BUCKET: ${LEAN_S3_BUCKET:-}
      LEAN_S3_REGION: ${LEAN_S3_REGION:-}
      # Redis para sessão e cache. Com LEAN_USE_REDIS=true o app troca
      # session.driver e os stores de cache para redis (SessionServiceProvider /
      # CacheServiceProvider leem a config `useRedis`).
      LEAN_USE_REDIS: ${LEAN_USE_REDIS:-false}
      # ATENÇÃO ao scheme: o default do app é 'tls' (laravelConfig.php, redis.default.scheme).
      # O Redis desta stack fala TCP puro dentro da rede interna, então precisa ser 'tcp'
      # explicitamente — com 'tls' o host vira "tls://..." e a conexão falha.
      LEAN_REDIS_SCHEME: ${LEAN_REDIS_SCHEME:-tcp}
      LEAN_REDIS_HOST: ${LEAN_REDIS_HOST:-time_redis}
      LEAN_REDIS_PORT: ${LEAN_REDIS_PORT:-6379}
      LEAN_REDIS_PASSWORD: ${LEAN_REDIS_PASSWORD:-}
      LEAN_REDIS_DB: ${LEAN_REDIS_DB:-0}
      # Só para apontar para um Redis EXTERNO (ex: tcp://host:6379). Se preenchida,
      # a URL sobrepõe host/porta/senha acima.
      LEAN_REDIS_URL: ${LEAN_REDIS_URL:-}
      # Chat de suporte com IA (Time Bot) — o widget só aparece com key + assistant configurados
      LEAN_OPENAI_API_KEY: ${LEAN_OPENAI_API_KEY:-}
      LEAN_SUPPORTCHAT_ASSISTANT_ID: ${LEAN_SUPPORTCHAT_ASSISTANT_ID:-}
      LEAN_SUPPORTCHAT_ENABLED: ${LEAN_SUPPORTCHAT_ENABLED:-true}
      LEAN_SUPPORTCHAT_SCREEN_CONTEXT: ${LEAN_SUPPORTCHAT_SCREEN_CONTEXT:-true}
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CAP_CHOWN
      - CAP_SETGID
      - CAP_SETUID
    # Sem publicação de porta no host: quem expõe 80/443 é o proxy do Coolify,
    # que roteia para esta porta interna. Usar `ports` aqui deixaria o app
    # acessível direto por IP:porta, fora do TLS e das regras do proxy.
    expose:
      - "8080"
    volumes:
      - public_userfiles:/var/www/html/public/userfiles
      - userfiles:/var/www/html/userfiles
      - plugins:/var/www/html/app/Plugins
      - logs:/var/www/html/storage/logs
    depends_on:
      time_db:
        condition: service_healthy
      time_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  time_db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD (openssl rand -base64 32)}
      MYSQL_DATABASE: ${LEAN_DB_DATABASE:-leantime}
      MYSQL_USER: ${LEAN_DB_USER:-leantime}
      MYSQL_PASSWORD: ${LEAN_DB_PASSWORD:?defina LEAN_DB_PASSWORD no Coolify}
    command: --character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Autenticado: sem credencial o ping retorna sucesso mesmo com o MySQL
      # recusando login, e o app subiria antes do banco estar realmente pronto.
      # CMD-SHELL (não CMD): a forma exec não tem shell para expandir a variável.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  time_redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # A sessão do usuário passa a morar aqui: perder o dataset desloga todo mundo.
    # Por isso appendonly + volume, e não um Redis puramente em memória.
    # A senha é opcional; quando LEAN_REDIS_PASSWORD está definida, o servidor
    # passa a exigi-la. O $$ escapa a interpolação do compose para o shell do
    # container avaliar — sem isso a senha nunca chegaria ao redis-server.
    command: sh -c 'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      REDIS_PASSWORD: ${LEAN_REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Autentica quando há senha, senão o ping volta NOAUTH e o serviço nunca
      # fica healthy — o que travaria o app no depends_on.
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+--no-auth-warning -a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  redis_data:
  userfiles:
  public_userfiles:
  plugins:
  logs:
